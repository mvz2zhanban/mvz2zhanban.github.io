<script>
    const wait = document.getElementById('time_is_not_much');
    function getRemainingSeconds() {
        const now = new Date();
        const target = new Date(now.getFullYear(), 11, 25);
        
        if (now > target) {
            target.setFullYear(now.getFullYear() + 1);
        }
        
        const remainingSeconds = Math.floor((target - now) / 1000);
        const isTruthDay = now.getMonth() === 11 && now.getDate() === 25;

        const hiddenDiv = document.getElementById('wait_is_worthless');
        const notReady = document.getElementById('time');

        if (isTruthDay) {
            hiddenDiv.style.display = 'block';
            notReady.style.display = 'none';
        } else {
            hiddenDiv.style.display = 'none';
            notReady.style.display = 'block';
        }
        return remainingSeconds;
    }

    wait.textContent = getRemainingSeconds() + "s";

    setInterval(() => {
        wait.textContent = getRemainingSeconds() + "s";
    }, 1000);
</script>
