<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>MVZ二战版官网速通排行榜</title>
    <link rel="icon" href="../../../image/title.png">
    <link rel="stylesheet" href="../../../styles.css">
</head>
<body>
    <div class="behind-back"></div>
    <div class="rectangle-back"></div>
    <img class="img-center" src="../../../image/logo.jpg" alt="MVZ二战版LOGO" width="981.8" height="561.8">
    <p class="choose">
        <a href="../../../index.html">首页</a>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        速通排行榜&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <a href="../../../ost.html">OST</a>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <a href="../../../save_update.html">存档开发日志</a>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <a href="../../../mod_update.html">模组开发日志</a>
    </p>
    <p class="choose">
        全部通关&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <a href="../../single_chapter/chapter1/index.html">单章节速通</a>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        单个关卡速通(暂不支持)
    </p>
    <p class="choose">
        <a href="../no_skip/index.html">不跳过序章</a>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        跳过序章&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    </p>
    <h1>速通(跳过序章)排行榜！</h1>
    <div id="leaderboard"></div>
</body>
<script>
fetch('./leaderboard.json')
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById('leaderboard');

    let rank = 1;

    Object.entries(data).forEach(([name, info]) => {
        const h3 = document.createElement('h3');

        const link = document.createElement('a');
        link.textContent = `#${rank} ${name}`;
        link.href = info.video;
        link.target = "_blank";

        const time = document.createElement('span');
        time.textContent = " 时间：" + info.time;

        h3.appendChild(link);
        h3.appendChild(time);
        container.appendChild(h3);

        rank++;
    });
  })
  .catch(err => {
    console.error("读取JSON失败:", err);
  });
</script>
</html>
